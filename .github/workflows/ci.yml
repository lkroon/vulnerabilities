name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # nx affected needs history to compute a base
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          # single source of truth with local dev - see .nvmrc
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      # --all rather than --base: deterministic, and correct on both
      # pull_request and push-to-main, where no diff base exists.
      - run: npx nx format:check --all

      - run: npx nx run-many -t lint test build

      # Playwright needs a browser present. Chromium only - the config declares
      # one project, see apps/web-e2e/playwright.config.mts.
      - run: npx playwright install --with-deps chromium

      # Serial on purpose. Both e2e projects want the API on :3000 - api-e2e via
      # `dependsOn: api:serve`, web-e2e via its Playwright `webServer`. Running
      # them concurrently means two processes race to start the same continuous
      # task, and Nx dedupes the loser into "waiting in another nx process"
      # rather than serving. One at a time removes the contention entirely.
      - run: npx nx run-many -t e2e --parallel=1
